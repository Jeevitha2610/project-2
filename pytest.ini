[pytest]
pythonpath = src .
testpaths = tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
cache_dir = .pytest_cache
addopts = -ra -q --strict-markers
markers =
    unit: Fast isolated unit tests (Tier 1 & Tier 2)
    api: FastAPI endpoint tests (Tier 1 & Tier 2)
    integration: Cross-component integration tests (Tier 3)
    e2e: Playwright browser end-to-end tests (Tier 4)
    slow: Computationally heavy tests
    anyio: Asynchronous tests managed via anyio plugin
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::PendingDeprecationWarning
